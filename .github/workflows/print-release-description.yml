name: Print release description

on:
  release:
    types: [published]

jobs:
  print-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Imprimir descrição da release
        run: node scripts/print-release-description.js
        env:
          RELEASE_DESCRIPTION: ${{ github.event.release.body }}
